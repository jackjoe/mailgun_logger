name: Elixir CI

on:
  push:
    branches: [master]
  # Every pull request, also one that targets another branch in a stack
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # Only Erlang and Elixir come from .tool-versions. The prebuilt rebar3
      # 3.22.1 that setup-beam downloads does not load on OTP 28, and mix
      # installs its own rebar3.
      - name: Read the Erlang and Elixir versions
        id: versions
        run: |
          echo "otp=$(awk '/^erlang /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "elixir=$(awk '/^elixir /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.versions.outputs.otp }}
          elixir-version: ${{ steps.versions.outputs.elixir }}
          version-type: strict

      - name: Restore dependencies and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test
